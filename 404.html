<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang — English for Construction</title>
<style>
  :root{
    --ink:#0F2033; --ink-soft:#4A5C6E; --panel:#F1F4F7;
    --rule:#D5DDE4; --steel:#1F6C93; --signal:#F2B705;
    --mono: ui-monospace,"Cascadia Mono","Consolas","Roboto Mono",monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:#fff;color:var(--ink);font-family:var(--sans);
    line-height:1.55;display:flex;min-height:100vh;align-items:center;
  }
  .wrap{max-width:520px;margin:0 auto;padding:40px 24px}
  .code{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--steel);margin:0 0 12px;
  }
  h1{margin:0 0 14px;font-size:25px;line-height:1.25;font-weight:650;letter-spacing:-.015em}
  p{margin:0 0 14px;color:var(--ink-soft);font-size:15px}
  .hint{
    background:var(--panel);border-left:3px solid var(--signal);
    padding:14px 18px;border-radius:0 4px 4px 0;font-size:14px;
  }
  .hint p{margin:0;color:var(--ink-soft)}
  a{color:var(--steel)}
  a:focus-visible{outline:2px solid var(--steel);outline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">Lỗi 404</p>
    <h1>Không tìm thấy trang này</h1>
    <p>Đường dẫn bạn vừa mở không tồn tại trên máy chủ audio của giáo trình.</p>
    <div class="hint">
      <p>Hãy quét lại mã QR cho thật thẳng và đủ sáng, hoặc <a href="/">mở trang chính</a> rồi chọn bài theo số Unit in trên sách.</p>
    </div>
  </div>
</body>
</html>
